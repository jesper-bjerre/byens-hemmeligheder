name: Backend — udrul

# Manuelt **og** på main. Manuelt, fordi B1 ikke har deployment slots: en
# udrulning går direkte i luften, og det skal være en beslutning og ikke en
# bivirkning af en rettet stavefejl i en README.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']

concurrency:
  # To udrulninger på én gang efterlader app'en i en tilstand, ingen har valgt.
  group: backend-deploy
  cancel-in-progress: false

permissions:
  # OIDC frem for en publish profile. En publish profile er en adgangskode, der
  # skal ligge i GitHub-secrets og roteres i hånden; en federated credential er
  # en tillidsrelation, der ikke kan lækkes ud af en logfil.
  id-token: write
  contents: read

env:
  APP_NAME: byensgaader-api-p
  RESOURCE_GROUP: Gulvet

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Testene køres igen her og ikke kun i CI. En udrulning, der ikke selv
      # har set testene være grønne, er en udrulning på tillid.
      - name: Test
        run: dotnet test --configuration Release
        working-directory: backend

      # Framework-dependent: App Service Linux har DOTNETCORE|10.0, så
      # runtimen behøver ikke pakkes med. Det halverer artefaktet og lader
      # Azure holde runtimen opdateret.
      - name: Publicér
        run: >
          dotnet publish src/ByensGaader.Api
          --configuration Release
          --output ${{ runner.temp }}/publish
        working-directory: backend

      - name: Pak
        run: zip -r "${{ runner.temp }}/app.zip" .
        working-directory: ${{ runner.temp }}/publish

      # `azure/login` svarer det samme på en tom secret som på en forkert:
      # "Not all values are present". Den besked sender én på jagt efter en
      # tillidsrelation, der er helt i orden. Her står der i stedet hvilken
      # af de tre der mangler — uden at afsløre nogen af dem.
      - name: Kontrollér at de tre secrets findes
        env:
          CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B9D566BBDA294AA2938B7D6C22202713 }}
          TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_8C3788C75A2141DC8F151FE1367B6BF0 }}
          SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E99D9924A1B746E89A161398EDAB5234 }}
        run: |
          mangler=0
          for navn in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            vaerdi="${!navn}"
            if [ -z "$vaerdi" ]; then
              echo "::error::AZURE_$navn er tom eller findes ikke."
              mangler=1
            elif ! printf '%s' "$vaerdi" | grep -qE '^[0-9a-fA-F-]{36}$'; then
              # Et GUID er 36 tegn. Er den kortere, er der typisk kopieret
              # med et mellemrum eller et linjeskift.
              echo "::error::AZURE_$navn ligner ikke et GUID (${#vaerdi} tegn)."
              mangler=1
            else
              echo "AZURE_$navn: ✓ 36 tegn"
            fi
          done

          if [ "$mangler" = "1" ]; then
            echo "::error::De oprettes af Deployment Center i Azure-portalen. Kør den igen."
            exit 1
          fi

      - name: Log ind i Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B9D566BBDA294AA2938B7D6C22202713 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8C3788C75A2141DC8F151FE1367B6BF0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E99D9924A1B746E89A161398EDAB5234 }}

      # `az webapp deploy` frem for `azure/webapps-deploy`.
      #
      # Azure slår SCM-basisgodkendelse fra på nye web apps, og den action
      # kræver den — udrulningen fejler med "Basic authentication is disabled".
      # Den nemme udvej er at slå den til igen, men så er der en adgangskode
      # til app'en, som skal opbevares og roteres. Det var præcis dét, OIDC
      # skulle gøre overflødigt.
      #
      # `az webapp deploy` bruger i stedet den bearer-token, `azure/login` lige
      # har hentet, og den rolle service principalen har på app'en. Ingen
      # adgangskode nogen steder.
      - name: Udrul
        run: >
          az webapp deploy
          --name "$APP_NAME"
          --resource-group "$RESOURCE_GROUP"
          --src-path "${{ runner.temp }}/app.zip"
          --type zip
          --async false

      # Uden dette kan en udrulning være "lykkedes", mens app'en svarer 503 —
      # det gjorde den i ugevis, før nogen kiggede.
      - name: Kontrollér at den svarer
        run: |
          host=$(az webapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query defaultHostName -o tsv)
          echo "Prøver https://$host/health"

          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/health" || true)
            if [ "$code" = "200" ]; then
              echo "Sund efter $attempt forsøg."
              curl -s "https://$host/health"
              exit 0
            fi
            echo "  forsøg $attempt: $code"
            sleep 15
          done

          echo "::error::/health svarede aldrig 200. Udrulningen er i luften, men app'en er ikke sund."
          exit 1
