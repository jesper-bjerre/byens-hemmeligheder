name: Webadmin — udrul

on:
  push:
    branches: [main]
    paths:
      - "webApps/webadmin/**"
      - ".github/workflows/azure-static-web-apps-salmon-grass-0b3946003.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "webApps/webadmin/**"
      - ".github/workflows/azure-static-web-apps-salmon-grass-0b3946003.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: webadmin-${{ github.event.pull_request.number || 'produktion' }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: webApps/webadmin/package-lock.json

      - name: Installér afhængigheder
        run: npm ci
        working-directory: webApps/webadmin

      - name: Test og byg
        run: npm run check
        working-directory: webApps/webadmin

      # Angular er allerede bygget og testet ovenfor. Azure-actionen skal kun
      # uploade artefaktet; dermed afhænger resultatet ikke af Oryx' egen
      # detektion af monorepo, Angular-version eller Node-version.
      - name: Udrul
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_GRASS_0B3946003 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "webApps/webadmin/dist/webadmin/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Luk preview-miljø
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_GRASS_0B3946003 }}
          action: "close"
