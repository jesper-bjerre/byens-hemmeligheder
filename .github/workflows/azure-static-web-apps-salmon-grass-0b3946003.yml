name: Webadmin — udrul

on:
  push:
    branches: [main]
    paths:
      - "webApps/webadmin/**"
      - ".github/workflows/azure-static-web-apps-salmon-grass-0b3946003.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "webApps/webadmin/**"
      - ".github/workflows/azure-static-web-apps-salmon-grass-0b3946003.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: webadmin-${{ github.event.pull_request.number || 'produktion' }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
      - name: Byg og udrul
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_GRASS_0B3946003 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "webApps/webadmin"
          api_location: ""
          output_location: "dist/webadmin/browser"
          app_build_command: "npm run build"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Luk preview-miljø
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_GRASS_0B3946003 }}
          action: "close"
