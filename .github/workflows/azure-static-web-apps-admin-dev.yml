name: Webadmin — udrul DEV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "webApps/webadmin/**"
      - ".github/workflows/azure-static-web-apps-admin-dev.yml"

permissions:
  contents: read

concurrency:
  group: webadmin-dev
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Byg og udrul DEV
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: webApps/webadmin/package-lock.json

      - name: Installér afhængigheder
        run: npm ci
        working-directory: webApps/webadmin

      # dev-cloud er stadig et optimeret produktionsbuild. Den eneste forskel
      # er, at buildet peger på DEV-API'et og aldrig på PROD-data.
      - name: Test og byg til DEV
        run: npm run check:dev
        working-directory: webApps/webadmin

      - name: Udrul til DEV
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BYENSGAADER_ADMIN_D }}
          action: "upload"
          app_location: "webApps/webadmin/dist/webadmin/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true
